<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/giboire-design-system-1525010e-43eb-4222-b497-2401770fb387/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/giboire-design-system-1525010e-43eb-4222-b497-2401770fb387/tokens/colors.css">
  <link rel="stylesheet" href="_ds/giboire-design-system-1525010e-43eb-4222-b497-2401770fb387/tokens/typography.css">
  <link rel="stylesheet" href="_ds/giboire-design-system-1525010e-43eb-4222-b497-2401770fb387/tokens/radius.css">
  <link rel="stylesheet" href="_ds/giboire-design-system-1525010e-43eb-4222-b497-2401770fb387/tokens/effects.css">
  <script src="_ds/giboire-design-system-1525010e-43eb-4222-b497-2401770fb387/_ds_bundle.js"></script>
  <style>
    @media (max-width: 1180px) { .gib-sb-sep { display: none !important; } }
  </style>
</helmet>
<div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--gib-r, 16px);padding:8px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;box-shadow:var(--shadow-lg)">
  <div style="flex:1 1 200px;min-width:0;display:flex;align-items:center;padding:0 16px">
    <input value="{{ q }}" onInput="{{ setQ }}" placeholder="Résidence, ville, mot-clé…" style="width:100%;border:none;outline:none;background:transparent;font-size:14.5px;font-family:var(--font-body);color:var(--text-strong);padding:11px 0">
  </div>
  <div class="gib-sb-sep" style="width:1px;background:var(--divider);align-self:center;height:26px"></div>
  <div style="flex:1 1 150px;min-width:0;display:flex;align-items:center">
    <select value="{{ filterType }}" onChange="{{ setType }}" style="width:100%;border:none;outline:none;background:transparent;font-size:14.5px;font-family:var(--font-body);color:var(--text-strong);padding:11px 16px;cursor:pointer;appearance:none">
      <option value="">Type de bien</option>
      <option value="T1">T1</option>
      <option value="T2">T2</option>
      <option value="T3">T3</option>
      <option value="T4">T4</option>
    </select>
  </div>
  <div class="gib-sb-sep" style="width:1px;background:var(--divider);align-self:center;height:26px"></div>
  <div style="flex:1 1 150px;min-width:0;display:flex;align-items:center">
    <select value="{{ filterCity }}" onChange="{{ setCity }}" style="width:100%;border:none;outline:none;background:transparent;font-size:14.5px;font-family:var(--font-body);color:var(--text-strong);padding:11px 16px;cursor:pointer;appearance:none">
      <option value="">Toutes les villes</option>
      <option value="Rennes">Rennes</option>
      <option value="Nantes">Nantes</option>
      <option value="Saint-Malo">Saint-Malo</option>
      <option value="Vannes">Vannes</option>
      <option value="La Baule">La Baule</option>
      <option value="Angers">Angers</option>
      <option value="Bordeaux">Bordeaux</option>
      <option value="Paris 19e">Paris 19e</option>
    </select>
  </div>
  <div style="flex:1 1 140px;min-width:140px;display:flex"><x-import component-from-global-scope="GiboireDesignSystem_152501.Button" variant="accent" fullWidth="{{ true }}" onClick="{{ runSearch }}" hint-size="100%,46px">Rechercher</x-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;760px&quot;,&quot;height&quot;:&quot;64px&quot;},&quot;q&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;setQ&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(e:any)=&gt;void&quot;},&quot;filterType&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;setType&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(e:any)=&gt;void&quot;},&quot;filterCity&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;setCity&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(e:any)=&gt;void&quot;},&quot;runSearch&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;}}"></script>
</body>
</html>
